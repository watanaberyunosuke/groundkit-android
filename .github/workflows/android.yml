name: Android build

# Automatic runs are switched off until the repository variable ANDROID_CI_ENABLED is
# set to "true" (Settings > Secrets and variables > Actions > Variables). Until then
# every automatic run is skipped; "Run workflow" on the Actions tab always builds.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.ANDROID_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # gradle/gradle-daemon-jvm.properties asks for a JDK 25 daemon.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      # Signs the release APK only when the keystore secrets exist; otherwise it is
      # published unsigned (not installable) alongside the debug APK.
      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          out=app/build/outputs/apk/release
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets; leaving the release APK unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$out/app-release.apk" \
            "$out/app-release-unsigned.apk"
          rm "$out/app-release-unsigned.apk" "$RUNNER_TEMP/release.jks"
          "$apksigner" verify "$out/app-release.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: ramp-ops-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    # A v* tag publishes the APKs as a GitHub Release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ramp-ops-${{ github.sha }}
          path: apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $(find apk -name '*.apk')
